<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090a0e" />
    <title>Aether FM — World Music Radio</title>
    <link rel="stylesheet" href="style.css?v=world-1" />
    <script defer src="stations.js?v=world-1"></script>
    <script defer src="world-stations.js?v=world-1"></script>
    <script defer src="print.js"></script>
    <script defer src="mantle.js"></script>
    <script defer src="globe.js?v=world-1"></script>
    <script defer src="audio.js"></script>
    <script defer src="track.js"></script>
    <script defer src="app.js?v=world-1"></script>
  </head>
  <body>
    <header>
      <h1>
        <span class="seal" aria-hidden="true"><i></i><i></i><i></i></span
        ><em>Aether</em><span class="fm">FM</span
        ><span class="brand-cn">World Music Radio</span>
      </h1>
      <div class="tools">
        <button
          id="motion"
          aria-label="Pause visual motion"
          title="Pause visual motion"
        ></button
        ><button id="browse" aria-label="Browse music stations">
          <span data-icon="search"></span>Music stations
        </button>
      </div>
    </header>
    <main>
      <div id="sky" role="group" aria-label="Interactive globe">
        <canvas
          id="globe"
          tabindex="0"
          aria-label="Drag or use the arrow keys to rotate. Scroll, pinch, or use plus and minus to zoom."
        ></canvas
        ><canvas id="waves" aria-hidden="true"></canvas>
        <div id="pins"></div>
      </div>
      <section class="receiver" aria-label="Radio player">
        <div class="location">
          <span class="red-rule"></span><span id="place"></span>
        </div>
        <h2 id="headline"></h2>
        <div class="station-line">
          <h3 id="subhead"></h3>
          <span id="genre"></span>
        </div>
        <p id="credit" aria-live="polite" hidden></p>
        <div class="dial">
          <div class="dial-line" aria-hidden="true"><i id="needle"></i></div>
          <div class="dial-caption">
            <strong id="freq"></strong><span id="coordinates"></span>
          </div>
        </div>
        <div class="transport">
          <button id="play" aria-label="Play"></button
          ><span id="status" role="status"></span
          ><canvas
            id="spectrum"
            height="32"
            width="78"
            aria-label="Live signal spectrum"
            hidden
          ></canvas
          ><button id="next" aria-label="Next station" title="Next station">
            <span data-icon="next"></span>
          </button>
        </div>
      </section>
      <footer>
        <span>Drag to orbit <i>·</i> Select a point to explore</span
        ><span class="local"
          ><span id="clock-place"></span> local time <time id="clock"></time
        ></span>
      </footer>
    </main>
    <dialog id="picker" aria-label="Music stations">
      <div class="searchbar">
        <span data-icon="search"></span
        ><input
          type="search"
          id="search"
          aria-label="Search music stations"
          placeholder="Search station, place or sound"
        /><button id="close" aria-label="Close music stations">×</button>
      </div>
      <div class="library-filter">
        <select id="country" aria-label="Country or territory">
          <option value="">All countries</option>
        </select>
        <select id="family" aria-label="Genre">
          <option value="">All genres</option></select
        ><span id="count" aria-live="polite"></span>
      </div>
      <button id="area" hidden></button>
      <div id="list"></div>
      <div class="directory-note">
        Directory from
        <a
          href="https://www.radio-browser.info/"
          target="_blank"
          rel="noreferrer"
          >Radio Browser</a
        >
        · Nearby places from
        <a href="https://www.geonames.org/" target="_blank" rel="noreferrer"
          >GeoNames</a
        >
      </div>
    </dialog>
  </body>
</html>
